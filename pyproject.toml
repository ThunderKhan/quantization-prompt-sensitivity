[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantization-prompt-sensitivity"
version = "0.1.0"
description = "Reproducible experiments for prompt sensitivity and quantized small language models."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
